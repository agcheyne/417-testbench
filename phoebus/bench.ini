# Phoebus settings for the bench panel (bench_panel.sh): the three IOCs on this PC, no archive.
# N1470 IOC on CA port 5070, PiLas 5072 (loopback only), ThorLabs motors 5064.
org.phoebus.pv.ca/addr_list=127.0.0.1 127.0.0.1:5070 127.0.0.1:5072
org.phoebus.pv.ca/auto_addr_list=false
org.phoebus.pv/default=ca
org.csstudio.trends.databrowser3/urls=
org.csstudio.trends.databrowser3/archives=
# no Kafka alarm server here: hide Phoebus' own alarm apps (Annunciator, Alarm Tree/Table/Area/Log). An open one
# retries localhost:9092 every second ("Broker may not be available"). The bench alarms are the IOC's alarm
# records and bin/n1470.sh annunciate (sound picker on the panel), not these.
org.phoebus.ui/hide_spi_menu=org.phoebus.ui.monitoring.FreezeUI,org.phoebus.applications.alarm.ui.annunciator.AnnunciatorTableMenuEntry,org.phoebus.applications.alarm.ui.area.AlarmAreaMenuEntry,org.phoebus.applications.alarm.ui.table.AlarmTableMenuEntry,org.phoebus.applications.alarm.ui.tree.AlarmTreeMenuEntry,org.phoebus.applications.alarm.logging.ui.AlarmLogTableMenuEntry
