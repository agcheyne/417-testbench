# Log settings for the bench panel (bench_panel.sh -logging): warnings and errors only, and the known
# harmless start-up messages of this Phoebus (4.7.3) without services silenced:
#  - the strip charts ask for archived data and there is no archive ("No archive reader for ''");
#  - ChannelFinder / alarm-logger clients and the cancelled "Read data" jobs (INFO);
#  - "No default setting for preference ...alarm.logging.ui/rawFiltering" (a Phoebus packaging bug);
#  - "Unsupported JavaFX configuration" and BufferUtil "Skipping image update".
# (The "Gdk-WARNING ... XSetErrorHandler" line comes from GTK itself and cannot be set here.)
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s [%3$s] %5$s%6$s%n
org.csstudio.trends.databrowser3.level = SEVERE
org.phoebus.archive.reader.level = SEVERE
org.phoebus.framework.preferences.level = OFF
javafx.level = SEVERE
org.phoebus.ui.javafx.BufferUtil.level = SEVERE
