# CAEN V1742 at 5 GS/s: 520 samples = 104 ns window, data written uncompressed.
# Twice the event rate of v1742_5G (29 Oct 2026, laser at 5 kHz: 1529 against 796 events/s)
# at 27 kB/event. The record starts about 50 ns before the TR0 trigger whatever its length;
# Photonis pulses arrive about 25 ns after it, so they sit 71-84 ns in and late pulses more
# than ~55 ns after the trigger are lost. 256 samples ends before the trigger.
DESCRIPTION="V1742 5 GS/s, 104 ns window, uncompressed, TR0 fast trigger (laser sync NIM)"
READOUT=v1742

# 0 = 5 GS/s, 1 = 2.5 GS/s, 2 = 1 GS/s (SetDRS4SamplingFrequency)
FREQ_CODE=0
# calibration file suffix that matches FREQ_CODE (calib_<serial>_<suffix>.dat)
CALIB_SPEED=5G
RECORD_LENGTH=520
# post-trigger: the trigger sits at about (150 - POST_TRIGGER) ns into the record after a
# fresh setup_rcdaq.sh (29 Oct 2026: 50 -> ~103 ns, at the very end; 75 -> 75 ns; 100 -> 50 ns,
# pulses at 72 ns, as with the 1024-sample profile). Board readback is ~6 higher (106).
POST_TRIGGER=100
# rcdaq file compression: 0 none, 4 bzip2 (default). bzip2 only saves ~24 % on these waveforms
# but limits the rate to ~1000 events/s and is ~250x slower to read back
COMPRESSION=0

# TR0/TR1 fast trigger: DC offset 0x8000; threshold DAC = 2^14 - threshold
# (0x3D98 = 17k, about right for an 800 mV NIM pulse); 1 = negative-going pulse
TRIG_DC_OFFSET=0x8000
TRIG_THRESHOLD=0x3D98
TRIG_POLARITY=1
# 1 = digitise the TR traces (channels 32-35), needed for timing against the trigger
FAST_TRIGGER_DIGITIZING=1
# on-board DRS4 correction off: the offline calibration does it
DRS4_CORRECTION=0
