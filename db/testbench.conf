# Site settings for the room-417 test bench (read by lib/tb.sh: tb_site).
# KEY=value, # starts a comment. Per-detector settings are in detectors/<name>/,
# readout settings in daq/<profile>.conf.

# --- data ---------------------------------------------------------------------
# rcdaq writes <DATA_ROOT>/<runtype>/<runtype>-<run>-<part>.evt
DATA_ROOT=/scratch2/data/hpDIRC
# V1742 timing/offset calibrations: calib_<serial>_<5G|2G|1G>.dat
CALIB_DIR=/scratch2/data/v1742.db
# where the begin-run readback scripts leave their files for rcdaq to pick up
ANC_PACKETS=/home/nptest/anc_packets
# shared run-number file, so numbers never repeat between setups
RUNNUMBER_FILE=/home/nptest/.runnumber.txt

# --- XY stage (Thorlabs APT through EPICS, THOR_X / THOR_Y, positions in mm) ----
# thor_epics itself silently ignores targets outside 0-150 mm; these limits are
# checked first by bin/motor.sh. Narrow them to what is safe inside the dark box.
X_MIN=0
X_MAX=150
Y_MIN=0
Y_MAX=150
# where scans leave the laser when they finish (off the detector)
REST_X=0
REST_Y=0
# folder thor_epics runs in: it passes each move through todo / busy / done files there
THOR_DIR=/home/nptest/v1
# arrival tolerance [mm] and the longest a single move may take [s]
MOVE_TOL=0.01
MOVE_TIMEOUT=180

# --- monochromator (JY H20 UV, ISA controller on GPIB through the NI GPIB-USB-HS) ---
# board (/dev/gpibN) and primary address; read by bin/monochromator.sh
MONO_GPIB_BOARD=0
MONO_GPIB_ADDR=1
# grating drive: 600 nm = 12000 steps (checked 28 Oct 2026, 349 -> 600 nm landed exactly)
MONO_STEPS_PER_NM=20
# move limits [nm]. 870 is the soft limit of the old LabVIEW program; below ~200 the
# lamp gives nothing. Never near 0 nm: zero order, white light.
MONO_MIN=200
MONO_MAX=870
# downward moves overshoot by this much [nm] and come back up, so every position is
# approached from below. Not measured: LabVIEW's Spectrometer Setup value is still needed.
MONO_BACKLASH=5
# longest a single move may take [s]; 251 nm took about 7 s
MONO_MOVE_TIMEOUT=120

# --- CAEN N1470 units ------------------------------------------------------------
# alias:board serial, as hv.conf may name them (must match UNITS in bin/n1470.sh;
# testbench.sh check compares them)
HV_UNITS="A:236 B:1593"

# --- V1742 inputs -------------------------------------------------------------------
# inputs the online monitor leaves out of the faces, clusters and channel picking (its noise
# canvas still shows them): pickup or dead. 27 Oct 2026: 1, 4 and 6 show only pickup (6 with
# 36 MHz), while the cable on inputs 0-15 is one pin off; check again once it is fixed.
MASKED_CHANNELS="1 4 6"

# --- notifications -----------------------------------------------------------
# space-separated addresses for "scan finished" mails; empty = none
NOTIFY_EMAIL=
