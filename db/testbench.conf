# Site settings for the room-417 test bench (read by lib/tb.sh: tb_site).

# KEY=value, # starts a comment. Per-detector settings are in detectors/<name>/,
# readout settings in daq/<profile>.conf.

# --- data ---------------------------------------------------------------------
# rcdaq writes <DATA_ROOT>/<runtype>/<runtype>-<run>-<part>.evt
DATA_ROOT=/scratch2/data/hpDIRC
# V1742 timing/offset calibrations: calib_<serial>_<5G|2G|1G>.dat
CALIB_DIR=/scratch2/data/v1742.db
# where the begin-run readback scripts leave their files for rcdaq to pick up
ANC_PACKETS=/home/nptest/anc_packets
# shared run-number file, so numbers never repeat between setups
RUNNUMBER_FILE=/home/nptest/.runnumber.txt

# --- V1742s ------------------------------------------------------------------------
# 1 = the boards are chained TRG-OUT -> S-IN in packet order (node 0 starts node 1;
# 0 = no cable, every board started by software. Only for two boards (setup_rcdaq.sh)
V1742_START_CHAIN=1

# --- XY stage (Thorlabs APT through EPICS, THOR_X / THOR_Y, positions in mm) ----
# limits are checked first by bin/motor.sh. Narrow them to what is safe inside the dark box.
X_MIN=0
X_MAX=150
Y_MIN=0
Y_MAX=150
# where scans leave the laser when they finish (default is 0,0 = off the detector)
REST_X=0
REST_Y=0
# folder thor_epics runs in: it passes each move through todo / busy / done files there
THOR_DIR=/home/nptest/v1
# arrival tolerance [mm] and the longest a single move may take [s]
MOVE_TOL=0.01
MOVE_TIMEOUT=180

# --- monochromator (JY H20 UV, ISA controller on GPIB through the NI GPIB-USB-HS) ---
# board (/dev/gpibN) and primary address; read by bin/monochromator.sh
MONO_GPIB_BOARD=0
MONO_GPIB_ADDR=1
# grating drive: 600 nm = 12000 steps (checked 28 Oct 2026, 349 -> 600 nm landed exactly)
MONO_STEPS_PER_NM=20
# move limits [nm]: the H20 UV's specified range, 200-750 nm 
# Below ~200 the lamp gives nothing. 
# 0 nm: zero order, i.e. white light.
MONO_MIN=200
MONO_MAX=750
# dark position [nm] for monochromator.sh dark: 1st order 100 nm and 2nd order 50 nm are
# absorbed before the sphere. 29 Oct 2026: read the same as a capped diode.
MONO_DARK=100
# downward moves overshoot by this much [nm] and come back up, so every position is
# approached from below. 
MONO_BACKLASH=5
# motor speed set before every move: 
# start speed, top speed [steps/s], ramp [ms]. 
# It was 300,450,1000; on 29 Oct 2026 saw lost steps, so it was halved for safety.
# Cause was found to be mechanical (drive jamming; thread and counter mechanism oiled the same day):
# Can probably be safely moved back to 300,450,1000.
MONO_SPEED=150,225,2000
# longest a single move may take [s]; 750 -> 100 nm (13000 steps) takes about 60 s at MONO_SPEED
MONO_MOVE_TIMEOUT=120

# --- CAEN N1470 units ------------------------------------------------------------
# alias:board serial, as hv.conf may name them (must match UNITS in bin/n1470.sh;
# testbench.sh check compares them)
HV_UNITS="A:236 B:1593"

# --- V1742 inputs -------------------------------------------------------------------
# inputs the online monitor leaves out of channel picking.
MASKED_CHANNELS="1 4 6" # During Photonis testing, 1,4,6 were dead.

# --- notifications -----------------------------------------------------------
# space-separated addresses for "scan finished" mails and HV alarms (new, changed, cleared;
# bin/n1470.sh); empty = none
NOTIFY_EMAIL=a.cheyne.1@research.gla.ac.uk
