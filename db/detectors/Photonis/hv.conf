# HV setpoints for this detector on the CAEN N1470 units, one row per electrode.
#
#   electrode  unit  ch   vset_V  iset_uA  rup_Vs  rdw_Vs  maxv_V  [imax_uA  r_MOhm]
#
# electrode  any name without spaces; bin/n1470.sh shows it next to the channel
# unit       A or B (the aliases in n1470.sh UNITS) or the board serial (236, 1593)
# ch         0-3
# vset_V ... values for "testbench.sh hv-load"; "-" = leave that parameter as it is
#            on the supply. Voltages are magnitudes, as the N1470 takes them.
# A row whose unit or ch is "-" is documentation only: hv-load skips it.
# imax_uA    optional (with r_MOhm): IMON alarm limit of the channel (MINOR above it; 360
#            when not given); r_MOhm  its load resistance, for a MINOR alarm when IMON is more
#            than 10 % above VMON / r ("-" = no such check). Read by bin/bench_publisher.sh into
#            the N1470 IOC (docs/epics.md).
#
# hv-load only sets these parameters; it never switches a channel on, and it
# refuses to change a channel that is on.

# One supply over the tube's divider (unit A ch0 from 27 Oct 2026). The MCP_Scan runs used -2230 V (scan_config.json,
# "scan2_photonis_bot_..._2230V").
# divider: 322 uA at 2100 V, 345 uA at 2250 V (6.52 / 6.51 MOhm, 1 Nov 2026); ISET 400 uA trips it
divider     A  0   2100  -  -  -  -  360  6.5
