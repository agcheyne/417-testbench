# Incom HRPPD #26 (sealed 23 Apr 2024; Incom test report of 13 Nov 2024, "HRPPD_26_Test_Report_v2.pdf").
# First mounted 4 Nov 2026. Stage position and V1742 slot still to be filled in.
# KEY=value, # starts a comment, empty value = not known yet.

NAME=HRPPD_26
# HRPPD, LAPPD, MCP-PMT, PMT, SiPM, ...
TYPE=HRPPD
MAKER=Incom
SERIAL=26
DESCRIPTION="HRPPD #26, cofired direct readout, 32 x 32 pads of 3 mm at 3.25 mm pitch, 5 electrodes on the CAEN N1470s"

# rcdaq run type: data go to <DATA_ROOT>/<RUNTYPE>/<RUNTYPE>-<run>-<part>.evt
# (several detectors may share one; "test" and "junk" always exist)
RUNTYPE=HRPPD

# --- anode geometry (rows x cols of mapping.txt; row 0 / col 0 as defined there) ---
NROWS=32
NCOLS=32
PITCH_X_MM=3.25
PITCH_Y_MM=3.25

# --- where the detector sits under the XY stage --------------------------------
# motor position [mm] with the laser on the centre of pixel row 0, col 0, and
# whether the motor coordinate grows (+1) or shrinks (-1) with col / row.
# Lets the analysis and scan script turn motor positions into pixels.
STAGE_X0_MM=
STAGE_Y0_MM=
STAGE_X_DIR=1
STAGE_Y_DIR=1

# --- high voltage ---------------------------------------------------------------
# n1470 (CAEN, set per electrode in hv.conf), keithley (photocathode-current test), none
HV_SUPPLY=n1470
# signal polarity on the readout: negative or positive
POLARITY=negative
