# HV setpoints for this detector on the CAEN N1470 units, one row per electrode.
#
#   electrode  unit  ch   vset_V  iset_uA  rup_Vs  rdw_Vs  maxv_V  [imax_uA  r_MOhm  trip_s]
#
# electrode  any name without spaces; bin/n1470.sh shows it next to the channel
# unit       A or B (the aliases in n1470.sh UNITS) or the board serial (236, 1593)
# ch         0-3
# vset_V ... values for "testbench.sh hv-load"; "-" = leave that parameter as it is
#            on the supply. Voltages are magnitudes, as the N1470 takes them.
# A row whose unit or ch is "-" is documentation only: hv-load skips it.
# imax_uA    optional: IMON alarm limit of the channel (MINOR above it; 360 when not given);
#            r_MOhm  its load resistance, for a MINOR alarm when IMON is more than 10 % above
#            VMON / r ("-" = no such check); trip_s  the supply's TRIP time ("-" = leave it).
#
# hv-load only sets these parameters (and PDWN = RAMP on every row); it never switches a
# channel on, and it refuses to change a channel that is on.
#
# HRPPD #26, from the Incom test report (13 Nov 2024):
#   operating point (ROP): PC 1950, MCP1 entry 1750, MCP1 exit 1075, MCP2 entry 875, MCP2 exit 200
#     = 200 V PC gap, 675 V per MCP, 200 V between the MCPs, 200 V to the anode; gain 3.3e6
#   limits: 700 V per MCP and 2200 V on the PC (tested no higher); afterpulsing > 4 % at
#     700 V per MCP, so stay at <= 675 V per MCP (Incom's lifetime advice)
#   MCPs 10.9 MOhm each (62 uA at 675 V); bleeders to ground as in the report: 3.0 MOhm on
#     MCP1 exit, 0.5 MOhm on MCP2 exit. The N1470 cannot take current back, so each exit
#     channel supplies bleeder current - MCP current (MCP1 exit 296 uA, MCP2 exit 338 uA at the
#     ROP; up to 367 / 400 uA while the MCP above it is at 0 V).
#
# Cabling (recommended 4 Nov 2026): the four MCP electrodes on one unit (A), so they switch
# and ramp together, and the photocathode alone on B. All five ramp at the same rate, so no
# gap ever goes above its final value while ramping; the IOC switches all five off if one trips
# or is off while the others are on (n1470_group.db).
#
# vset below = the first, safe dark state: 500 V per MCP, PC 10 V LESS negative than MCP1 entry
# (no photoelectrons reach the MCPs; Incom's state for MCP-only dark counts). Step up from
# there, all five together, with "testbench.sh hv-mcp MCP_V PC_GAP_V".
# maxv = Incom's limits (700 V per MCP, 2200 V on the PC).
#
# electrode  unit ch  vset  iset  rup rdw  maxv  imax  r  trip
PC          B  0   1390    20  10  10  2200    10   -  1.0
MCP1-entry  A  0   1400   150  10  10  1800   100   -  1.0
MCP1-exit   A  1    900   500  10  10  1100   400   -  1.0
MCP2-entry  A  2    700   150  10  10   900   100   -  1.0
MCP2-exit   A  3    200   550  10  10   250   420   -  1.0
